<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Artist — My Music</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="icon" type="image/png" href="images/favicon.png">

</head>


<body>


<header class="header">

    <div class="logo">
        MY MUSIC
    </div>


    <nav class="navigation">

        <a href="index.html">
            Artists
        </a>

        <a href="albums.html">
            Albums
        </a>

        <a href="#">
            Other music
        </a>

    </nav>


    <button class="search-button">
        ⌕
    </button>

</header>



<main class="artist-page">


    <button class="back-button"
            onclick="history.back()">

        ← Back

    </button>



    <section class="artist-hero">


        <div class="artist-page-image">

            <img id="artistImage"
                 src=""
                 alt="">

        </div>



        <div class="artist-page-info">

            <p class="artist-label">
                ARTIST
            </p>

            <h1 id="artistName">
                Artist
            </h1>

        </div>


    </section>



    <section class="songs-section">


        <div class="section-header">

            <h2>
                Songs
            </h2>

            <span id="songsCount"
                  class="artists-count">
                0 songs
            </span>

        </div>



        <div id="songsList"
             class="songs-list">

        </div>


    </section>


</main>



<footer class="footer">

    <p>
        MY MUSIC © 2026
    </p>
    <div class="player">

        <div class="player-song">
    
            <img
                id="playerCover"
                src=""
                alt=""
            >
    
            <div class="player-info">
    
                <strong id="playerTitle">
                    Nothing playing
                </strong>
    
                <span id="playerArtist">
                    —
                </span>
    
            </div>
    
        </div>
    
    
        <div class="player-controls">
    
            <div class="player-buttons">

                <button
                    id="shuffleButton"
                    class="player-control"
                    title="Shuffle">
                    🔀
                </button>
            
                <button
                    id="previousButton"
                    class="player-control"
                    title="Previous">
                    ⏮
                </button>
            
                <button
                    id="playButton"
                    class="player-play"
                    title="Play / Pause">
                    ▶
                </button>
            
                <button
                    id="nextButton"
                    class="player-control"
                    title="Next">
                    ⏭
                </button>
            
                <button
                    id="repeatButton"
                    class="player-control"
                    title="Repeat">
                    🔁
                </button>
            
            </div>
    
    
            <div class="player-progress">
    
                <span id="currentTime">
                    0:00
                </span>
    
                <input
                    type="range"
                    id="progressBar"
                    value="0"
                    min="0"
                    max="100"
                >
    
                <span id="duration">
                    0:00
                </span>
    
            </div>
    
        </div>
    
    
        <div class="player-volume">
    
            <span>
                🔊
            </span>
    
            <input
                type="range"
                id="volumeBar"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >
    
        </div>
    
    
        <audio id="audioPlayer"></audio>
    
    </div>
    
    
        <button id="playButton">
            ▶
        </button>
    
    
        <div class="player-progress">
    
            <span id="currentTime">
                0:00
            </span>
    
            <input
                type="range"
                id="progressBar"
                value="0"
                min="0"
                max="100"
            >
    
            <span id="duration">
                0:00
            </span>
    
        </div>
    
    
        <audio id="audioPlayer"></audio>
    
    </div>
    
</footer>



<script src="artists.js"></script>
<script src="script.js"></script>

</body>

</html>
